<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0a1c">
  <meta name="description" content="مولّد نكات عشوائية باستخدام JokeAPI">
  <title>مولّد النكات | JAMIL AI</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#080817;color:#f8f7ff}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 50% 0%,#302064 0,transparent 55%),#080817}.card{width:min(100%,620px);padding:clamp(24px,6vw,48px);border:1px solid #7665be55;border-radius:26px;background:linear-gradient(145deg,#16142f,#100f24);box-shadow:0 24px 80px #0008}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:800;letter-spacing:.04em}.brand span{color:#a68aff}.lang,.next{border:1px solid #544b80;border-radius:12px;background:#211e3b;color:#f8f7ff;padding:10px 14px;cursor:pointer}.eyebrow{margin:34px 0 8px;color:#b29bff;font-size:13px;font-weight:700}.title{margin:0;font-size:clamp(28px,6vw,42px)}.desc{color:#aaa7c8;line-height:1.7}.joke{min-height:170px;margin:26px 0;padding:24px;border:1px solid #403a66;border-radius:18px;background:#0b0a1c;display:flex;flex-direction:column;justify-content:center;gap:14px}.joke-text{font-size:clamp(20px,4vw,27px);line-height:1.7;white-space:pre-wrap}.category{color:#a99bdf;font-size:12px}.next{width:100%;padding:14px 18px;border:0;background:linear-gradient(100deg,#7446ff,#315bff);font-size:16px;font-weight:700}.next:disabled{opacity:.6;cursor:wait}.error{min-height:24px;color:#ffb3bb;font-size:13px}.source{margin-top:20px;color:#8885a7;font-size:12px;text-align:center}.source a{color:#b29bff}
  </style>
</head>
<body>
  <main class="card">
    <div class="top"><div class="brand">JAMIL <span>AI</span></div><button id="language" class="lang" type="button">English</button></div>
    <p id="eyebrow" class="eyebrow">استراحة خفيفة</p>
    <h1 id="title" class="title">مولّد النكات العشوائية</h1>
    <p id="description" class="desc">اضغط الزر لتحصل على نكتة جديدة وآمنة للعائلة.</p>
    <section class="joke" aria-live="polite" aria-atomic="true"><div id="jokeText" class="joke-text">اضغط «نكتة جديدة» للبدء 😄</div><div id="category" class="category"></div></section>
    <button id="next" class="next" type="button">😄 نكتة جديدة</button>
    <p id="error" class="error" role="status"></p>
    <p class="source">Powered by <a href="https://jokeapi.dev/" target="_blank" rel="noopener noreferrer">JokeAPI</a></p>
  </main>
<script>
(() => {
  const ui = {
    ar: {eyebrow:'استراحة خفيفة',title:'مولّد النكات العشوائية',description:'اضغط الزر لتحصل على نكتة جديدة وآمنة للعائلة.',start:'اضغط «نكتة جديدة» للبدء 😄',next:'😄 نكتة جديدة',loading:'جارٍ جلب نكتة…',error:'تعذر جلب نكتة الآن. تحقق من اتصال الإنترنت وحاول مجددًا.',category:'التصنيف'},
    en: {eyebrow:'A little break',title:'Random Joke Generator',description:'Tap the button for a fresh, family-friendly joke.',start:'Press “Another joke” to begin 😄',next:'😄 Another joke',loading:'Getting a joke…',error:'Could not load a joke. Check your connection and try again.',category:'Category'}
  };
  let language='ar';
  const $=id=>document.getElementById(id);
  function setLanguage(next){
    language=next;const t=ui[language];document.documentElement.lang=language;document.documentElement.dir=language==='ar'?'rtl':'ltr';
    $('language').textContent=language==='ar'?'English':'العربية';$('eyebrow').textContent=t.eyebrow;$('title').textContent=t.title;$('description').textContent=t.description;$('next').textContent=t.next;
    if(!$('category').dataset.category)$('jokeText').textContent=t.start;
  }
  $('language').addEventListener('click',()=>setLanguage(language==='ar'?'en':'ar'));
  $('next').addEventListener('click',async()=>{
    const t=ui[language],button=$('next'),text=$('jokeText'),category=$('category'),error=$('error');
    button.disabled=true;button.textContent=t.loading;error.textContent='';category.textContent='';delete category.dataset.category;text.textContent=t.loading;
    const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),10000);
    try{
      const response=await fetch('https://v2.jokeapi.dev/joke/Any?safe-mode',{signal:controller.signal,headers:{Accept:'application/json'}});
      if(!response.ok)throw new Error('HTTP '+response.status);
      const joke=await response.json();if(joke.error)throw new Error('Joke API error');
      const content=joke.type==='twopart'?`${joke.setup}\n\n${joke.delivery}`:joke.joke;
      if(typeof content!=='string'||!content.trim())throw new Error('Empty joke');
      text.textContent=content;category.textContent=`${t.category}: ${joke.category||'Any'}`;category.dataset.category='loaded';
    }catch(_){text.textContent=t.start;error.textContent=t.error;}
    finally{clearTimeout(timeout);button.disabled=false;button.textContent=t.next;}
  });
})();
</script>
</body>
</html>
